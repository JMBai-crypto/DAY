<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母亲节快乐</title>
    <style>
        *{margin:0;padding:0}
        body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Microsoft YaHei','SimHei',sans-serif}
        canvas{display:block;position:fixed;top:0;left:0}
        .text-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;opacity:0;transition:opacity 2s}
        .text-box.show{opacity:1}
        h1{font-size:60px;color:#ffaaa5;text-shadow:0 0 10px #ff6b6b,0 0 20px #ff6b6b,0 0 40px #ff5252;margin-bottom:20px}
        h2{font-size:36px;color:#ffb8b8;text-shadow:0 0 10px #ff8a80,0 0 20px #ff8a80,0 0 40px #ff5252;margin-bottom:20px}
        h3{font-size:28px;color:#ffd0d0;text-shadow:0 0 10px #ff6b6b,0 0 20px #ff6b6b}
        .hint{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:#999;font-size:16px;z-index:10}
        @media(max-width:600px){h1{font-size:36px}h2{font-size:24px}h3{font-size:20px}.hint{font-size:14px;bottom:20px}}
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="text-box" id="box">
        <h1>母亲节快乐</h1>
        <h2>Happy Mother's Day</h2>
        <h3>健健康康，平安喜乐！</h3>
    </div>
    <div class="hint">💝  点击屏幕放烟花  💝</div>
    <script>
        const c=document.getElementById('c'),ctx=c.getContext('2d');
        let W=innerWidth,H=innerHeight;c.width=W;c.height=H;
        onresize=()=>{W=innerWidth;H=innerHeight;c.width=W;c.height=H};
        class P{constructor(x,y,c){this.x=x;this.y=y;this.c=c;this.vx=0;this.vy=0;this.l=60;this.ml=60;this.s=3}
        upd(){this.x+=this.vx;this.y+=this.vy;this.vy+=.05;this.l--;this.s*=.995}
        dr(){if(this.l>0&&this.s>.5){ctx.globalAlpha=this.l/this.ml;ctx.fillStyle=`rgb(${this.c[0]},${this.c[1]},${this.c[2]})`;ctx.beginPath();ctx.arc(this.x,this.y,Math.max(1,this.s),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
        al(){return this.l>0}}
        class F{constructor(x,y,t){this.x=x;this.y=y;this.ty=t;this.vy=-8;this.ps=[];this.b=false;this.tr=[];this.c=[[255,105,180],[255,20,147],[255,0,0],[255,215,0],[255,182,193],[255,127,80],[147,112,219]][Math.floor(Math.random()*7)]}
        upd(){if(!this.b){this.y+=this.vy;this.tr.push({x:this.x,y:this.y});if(this.tr.length>15)this.tr.shift();if(this.y<=this.ty){this.exp();this.b=true}}else{this.ps.forEach(p=>p.upd());this.ps=this.ps.filter(p=>p.al())}}
        exp(){for(let i=0;i<200;i++){let t=Math.random()*Math.PI*2,s=.8+Math.random()*.4,hx=16*Math.pow(Math.sin(t),3)*s,hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s,fx=hx*1.8+this.x+(Math.random()-.5)*6,fy=hy*1.8+this.y+(Math.random()-.5)*6,cl=[[255,105,180],[255,20,147],[255,0,0],[255,215,0],[255,182,193],[255,127,80],[147,112,219]][Math.floor(Math.random()*7)],p=new P(this.x,this.y,cl);p.vx=(fx-this.x)/25;p.vy=(fy-this.y)/25;p.l=60+Math.floor(Math.random()*60);p.ml=p.l;p.s=1.5+Math.random()*2;this.ps.push(p)}
        for(let i=0;i<30;i++){let an=Math.random()*Math.PI*2,sp=1+Math.random()*2,p=new P(this.x,this.y,this.c);p.vx=Math.cos(an)*sp;p.vy=Math.sin(an)*sp;p.l=30+Math.floor(Math.random()*30);p.ml=p.l;p.s=2+Math.random()*2;this.ps.push(p)}}
        dr(){if(!this.b){this.tr.forEach((pt,i)=>{ctx.globalAlpha=(i+1)/this.tr.length*.7;ctx.fillStyle=`rgb(${this.c[0]},${this.c[1]},${this.c[2]})`;ctx.beginPath();ctx.arc(pt.x,pt.y,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});ctx.fillStyle=`rgb(${this.c[0]},${this.c[1]},${this.c[2]})`;ctx.beginPath();ctx.arc(this.x,this.y,4,0,Math.PI*2);ctx.fill()}else this.ps.forEach(p=>p.dr())}
        dn(){return this.b&&this.ps.length===0}}
        class S{constructor(){this.x=Math.random()*W;this.y=Math.random()*H;this.s=.5+Math.random()*2;this.br=.2+Math.random()*.8;this.ph=Math.random()*Math.PI*2}
        dr(f){let t=(Math.sin(f*.05+this.ph)+1)/2,b=Math.floor(255*this.br*(.5+t*.5));ctx.fillStyle=`rgb(${b},${b},${b})`;ctx.beginPath();ctx.arc(this.x,this.y,Math.max(.5,this.s),0,Math.PI*2);ctx.fill()}}
        const fs=[],ss=[];for(let i=0;i<100;i++)ss.push(new S());
        let fr=0;
        function la(x,y){let ty=Math.max(50,y-100-Math.random()*150);fs.push(new F(x||Math.random()*W,y||H,ty))}
        onkeydown=e=>{if(e.code==='Space'){e.preventDefault();la(Math.random()*W,H)}};
        c.onclick=e=>la(e.clientX,e.clientY);
        c.ontouchstart=e=>{e.preventDefault();la(e.touches[0].clientX,e.touches[0].clientY)};
        (function an(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ss.forEach(s=>s.dr(fr));fr++;if(fr%90===0)la(Math.random()*W,H);fs.forEach(f=>{f.upd();f.dr()});for(let i=fs.length-1;i>=0;i--){if(fs[i].dn()){fs.splice(i,1);document.getElementById('box').classList.add('show')}}requestAnimationFrame(an)})();
        setTimeout(()=>la(W*.5,H),500);setTimeout(()=>la(W*.3,H),1500);setTimeout(()=>la(W*.7,H),2500);
    </script>
</body>
</html>
